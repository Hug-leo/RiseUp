<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 600" role="img" aria-label="Bản đồ Việt Nam 34 tỉnh thành, gồm các đảo và hai quần đảo Hoàng Sa, Trường Sa">
  <title>Bản đồ 34 tỉnh thành Việt Nam (2025)</title>
  <desc>Lãnh thổ Việt Nam được thể hiện cùng Phú Quốc, các đảo ven bờ và hai quần đảo Hoàng Sa, Trường Sa.</desc>
  <style>
    .sovereignty-islands { color: #0d47a1; font-family: system-ui, sans-serif; pointer-events: none; }
    .sovereignty-islands circle, .sovereignty-islands ellipse { fill: currentColor; stroke: #fff; stroke-width: .8; }
    .sovereignty-islands text { fill: #17365d; font-size: 9px; font-weight: 700; paint-order: stroke; stroke: #f7fbff; stroke-width: 2px; stroke-linejoin: round; }
    .sovereignty-islands .sea-label { fill: #6d8eb7; font-size: 13px; letter-spacing: 2px; text-anchor: middle; }
    .sovereignty-islands .archipelago-boundary { fill: rgba(13,71,161,.04); stroke: #0d47a1; stroke-width: 1; stroke-dasharray: 4 3; }
    .sovereignty-islands .archipelago-label { fill: #b71c1c; font-size: 10px; text-anchor: middle; }
    .sovereignty-islands .sovereignty-label { fill: #b71c1c; font-size: 8px; letter-spacing: 1.2px; text-anchor: middle; }
    .sovereignty-islands .island-marker--featured circle, .sovereignty-islands .island-marker--featured ellipse { fill: #d32f2f; }
  </style>
